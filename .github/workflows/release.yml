name: Build API edition
on:
  push:
    tags: ['v*-api.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win64
            executable: gridcraft.exe
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable: gridcraft
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gridcraft
          key: ${{ matrix.target }}
      - name: Build
        working-directory: gridcraft
        run: cargo build --locked --release -p gridcraft --target ${{ matrix.target }}
        env:
          GRIDCRAFT_REQUIRE_WINRES: '1'
      - name: Package
        run: python scripts/package.py --platform ${{ matrix.platform }} --binary gridcraft/target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: GridCraft-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add source and checksums
        shell: bash
        run: |
          git archive --format=zip --prefix=GridCraft-API-source/ HEAD --output "dist/GridCraft-${GITHUB_REF_NAME#v}-source.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "GridCraft API Edition · AI 智能图表与数据分析" --notes-file RELEASE-NOTES.md dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt

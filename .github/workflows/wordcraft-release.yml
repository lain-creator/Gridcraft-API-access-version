name: Build WordCraft Chinese edition
on:
  push:
    tags: ['v*-wordcraft.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win64
            executable: wordcraft.exe
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable: wordcraft
    runs-on: ${{ matrix.os }}
    env:
      CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
      CRAFT_I18N_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordcraft
          key: wordcraft-${{ matrix.target }}
      - name: Build
        working-directory: wordcraft
        run: cargo build --locked --release -p wordcraft --target ${{ matrix.target }}
        env:
          WORDCRAFT_REQUIRE_WINRES: '1'
      - name: Package
        run: python scripts/package.py --app wordcraft --platform ${{ matrix.platform }} --binary wordcraft/target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: WordCraft-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add source and checksums
        shell: bash
        run: |
          git archive --format=zip --prefix=WordCraft-Chinese-source/ HEAD --output "dist/WordCraft-${GITHUB_REF_NAME#v}-source.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish separate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "WordCraft 0.11.0 中文版 · 字体与图片修复" --notes-file WORDCRAFT-RELEASE-NOTES.md dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt

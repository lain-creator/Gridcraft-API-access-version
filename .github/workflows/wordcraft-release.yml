name: Build WordCraft API edition
on:
  push:
    tags: ['v*-wordcraft.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win64
            executable: wordcraft.exe
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable: wordcraft
    runs-on: ${{ matrix.os }}
    env:
      CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
      CRAFT_I18N_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordcraft
          key: wordcraft-${{ matrix.target }}
      - name: Build
        working-directory: wordcraft
        run: cargo build --locked --release -p wordcraft --target ${{ matrix.target }}
        env:
          WORDCRAFT_REQUIRE_WINRES: '1'
      - name: Package
        run: python scripts/package.py --app wordcraft --platform ${{ matrix.platform }} --binary wordcraft/target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: WordCraft-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add source and checksums
        shell: bash
        run: |
          git archive --format=zip --prefix=WordCraft-API-source/ HEAD --output "dist/WordCraft-${GITHUB_REF_NAME#v}-source.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish separate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "WordCraft API Edition · 自定义 API 中英翻译" --notes-file WORDCRAFT-RELEASE-NOTES.md dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt
      - name: Remove only the superseded fixed-website WordCraft release
        if: github.ref_name == 'v0.11.0-wordcraft.20261027.2'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Verify both replacement packages are published before removing the exact old Release.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > published-assets.txt
          grep -Fx 'WordCraft-0.11.0-wordcraft.20261027.2-macos-arm64.zip' published-assets.txt
          grep -Fx 'WordCraft-0.11.0-wordcraft.20261027.2-win64.zip' published-assets.txt
          grep -Fx 'SHA256SUMS.txt' published-assets.txt
          if gh release view v0.11.0-wordcraft.20261027.1 >/dev/null 2>&1; then
            # Intentionally keep the source tag and Git history for recovery. Never touch GridCraft releases.
            gh release delete v0.11.0-wordcraft.20261027.1 --yes
          fi
